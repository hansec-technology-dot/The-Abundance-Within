<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Abundance Within — Remember. Reconnect. Live in Abundance.</title>
  <meta name="description" content="The Abundance Within: guided meditations, affirmations, and awakening resources to help you remember, reconnect, and live in true abundance.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #1B2E1B;
      --leaf: #2D4722;
      --leaf-soft: #24391f;
      --gold: #C4A052;
      --gold-bright: #DAA520;
      --cream: #F4F6F0;
      --cream-dim: #d9ddd0;
      --ink: #12200f;
      --font-display: 'Cinzel', serif;
      --font-quote: 'Cormorant Garamond', serif;
      --font-body: 'Inter', sans-serif;
      --radius-s: 4px;
      --radius-m: 10px;
      --container: 1180px;
    }
    
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg-dark);
      color: var(--cream);
      font-family: var(--font-body);
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
    }
    
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    ul { margin: 0; padding: 0; list-style: none; }
    button { font-family: inherit; cursor: pointer; }
    
    :focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }
    
    .wrap { max-width: var(--container); margin: 0 auto; padding: 0 32px; }
    
    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: 0.01em;
      margin: 0;
      color: var(--cream);
    }
    
    .section-head { max-width: 680px; margin: 0 auto 48px; text-align: center; }
    .section-head h2 { font-size: clamp(1.9rem, 3.2vw, 2.7rem); line-height: 1.2; }
    .section-head p {
      font-family: var(--font-quote);
      font-size: 1.35rem;
      font-style: italic;
      color: var(--gold);
      margin: 14px 0 0;
      line-height: 1.5;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 34px;
      border-radius: var(--radius-s);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: var(--ink);
      box-shadow: 0 8px 24px rgba(196,160,82,0.28);
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(196,160,82,0.4); }
    .btn-ghost { background: transparent; color: var(--cream); border-color: rgba(244,246,240,0.35); }
    .btn-ghost:hover { border-color: var(--gold-bright); color: var(--gold-bright); }
    .btn-sm { padding: 10px 20px; font-size: 0.85rem; }
    .btn-block { width: 100%; }
    
    /* NAV */
    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 60;
      background: rgba(20,32,17,0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(196,160,82,0.18);
    }
    .site-nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 74px; }
    .brand-mark { font-family: var(--font-display); font-size: 1.05rem; letter-spacing: 0.04em; color: var(--gold-bright); }
    .brand-mark span { color: var(--cream); }
    .site-nav nav ul { display: flex; gap: 34px; }
    .site-nav nav a { font-size: 0.88rem; color: var(--cream-dim); transition: color 0.2s ease; }
    .site-nav nav a:hover { color: var(--gold-bright); }
    
    @media (max-width: 760px) { .site-nav nav { display: none; } }
    
    /* HERO */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 140px 24px 100px;
      background: radial-gradient(ellipse 60% 50% at 50% 8%, rgba(218,165,32,0.16), transparent 60%), linear-gradient(180deg, #16241300 0%, var(--bg-dark) 70%), var(--bg-dark);
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      top: -15%; left: 50%;
      width: 120vw; height: 120vw;
      max-width: 1400px; max-height: 1400px;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(218,165,32,0.30) 0%, rgba(218,165,32,0.10) 32%, transparent 60%);
      filter: blur(6px);
      animation: sunbreathe 9s ease-in-out infinite;
    }
    @keyframes sunbreathe { 0%,100% { opacity: 0.75; transform: translateX(-50%) scale(1); } 50% { opacity: 1; transform: translateX(-50%) scale(1.06); } }
    .hero-inner { position: relative; z-index: 2; max-width: 820px; }
    .hero-eyebrow { font-family: var(--font-quote); font-style: italic; font-size: 1.15rem; color: var(--gold); margin: 0 0 18px; }
    .hero h1 {
      font-size: clamp(2.6rem, 7vw, 5rem);
      background: linear-gradient(120deg, var(--gold-bright) 10%, #f1d98a 45%, var(--gold) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.08;
    }
    .hero-statement { margin: 30px auto 0; max-width: 640px; font-size: clamp(1.05rem, 1.6vw, 1.2rem); color: var(--cream-dim); font-weight: 300; }
    .hero-submotto { margin: 26px 0 0; font-family: var(--font-display); font-size: 0.82rem; letter-spacing: 0.28em; color: var(--gold); text-transform: uppercase; }
